name: Usage Retention Cron

# Triggers the /api/cron/retention endpoint on a daily schedule so that
# usage_event monthly partitions are kept up to date and old partitions
# are dropped even when the project is not on Vercel Pro (where
# vercel.json's "crons" array would otherwise handle this).
#
# Required GitHub repository secrets:
#   APP_URL        - Public app URL, e.g. https://pdf-tools.example.com
#   CRON_SECRET    - Same value as the Vercel project env var CRON_SECRET
#                    (must be set in the deployed app for auth to be enforced)

on:
  schedule:
    # Daily at 03:00 UTC, matches the schedule in vercel.json.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: retention-cron
  cancel-in-progress: false

jobs:
  retention:
    name: Run usage_event retention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/retention
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL secret is not set"
            exit 1
          fi

          # Strip any trailing slash from APP_URL to avoid //api/cron/retention.
          url="${APP_URL%/}/api/cron/retention"

          # CRON_SECRET may be unset in the deployed app; in that case the
          # route accepts unauthenticated requests, so we only send the
          # header when the secret is configured.
          headers=(-H "User-Agent: github-actions/retention-cron")
          if [ -n "$CRON_SECRET" ]; then
            headers+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X GET "${headers[@]}" \
            "$url")

          echo "HTTP $http_code"
          cat response.json
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Retention endpoint returned HTTP $http_code"
            exit 1
          fi
